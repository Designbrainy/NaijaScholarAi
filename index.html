
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaijaScholar AI</title>

  <!-- PWA Manifest and Theme Color -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00A859" id="theme-color-meta">

  <!-- iOS PWA Meta Tags (optional but good practice) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NaijaScholar AI">
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png">


  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Set initial theme
    (function() {
      const theme = localStorage.getItem('naijaScholarTheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#1E293B'); // Example dark theme color
      } else {
        document.documentElement.classList.remove('dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#00A859');
      }
    })();

    tailwind.config = {
      darkMode: 'class', // Enable class-based dark mode
      theme: {
        extend: {
          colors: {
            primary: '#00A859', // Nigerian Green
            secondary: '#FCD116', // Nigerian Gold/Yellow
            accent: '#00205B', // Deep Blue
            lightbg: '#F0FDF4', // Light green background
            darktext: '#1E293B', // Slate 800
            mediumtext: '#475569', // Slate 600

            // Dark theme specific variations (optional, can use Tailwind's grays/slates directly)
            'dark-primary': '#10172A', // Example: A very dark blue, almost black for primary background in dark mode
            'dark-secondary': '#1E293B', // Example: Slate 800 for secondary surfaces
            'dark-card': '#0F172A', // Even darker for cards if needed, or use dark-secondary
            'dark-text-primary': '#F0FDF4', // Light green for primary text in dark mode
            'dark-text-secondary': '#94A3B8', // Slate 400 for secondary text
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.5.1",
    "@netlify/functions": "https://esm.sh/@netlify/functions@^4.1.8"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-lightbg dark:bg-dark-primary font-sans">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>
</html>
